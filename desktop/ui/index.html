<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rev</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }

  :root {
    --c1: #8f9dff; --c2: #5560e6; --c3: #3a44b8;        /* body gradient */
    --aura: rgba(95, 110, 235, .55);
    --ink: #101322;
  }

  /* ---------- speech bubble ---------- */
  #bubble {
    position: absolute; top: 6px; left: 6px; right: 6px; max-height: 168px;
    overflow-y: auto; scrollbar-width: none;
    background: rgba(13, 15, 24, 0.88);
    backdrop-filter: blur(14px);
    color: #eef0f8;
    border-radius: 14px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.5;
    opacity: 0; transform: translateY(4px) scale(.98);
    transition: opacity .28s ease, transform .28s ease;
    pointer-events: none; word-wrap: break-word;
    border: 1px solid transparent;
    background-clip: padding-box;
    box-shadow: 0 8px 28px rgba(0,0,0,.45), 0 0 0 1px rgba(120,140,255,.28) inset;
  }
  #bubble.show { opacity: 1; transform: translateY(0) scale(1); }
  #bubble .caret { display: inline-block; width: 7px; margin-left: 1px;
    background: #9fb0ff; height: 13px; vertical-align: text-bottom;
    animation: caret 1s steps(2) infinite; border-radius: 1px; }
  @keyframes caret { 50% { opacity: 0; } }
  #bubble .chip {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 7px;
    background: rgba(110, 130, 255, .14); color: #aebcff;
    border: 1px solid rgba(110, 130, 255, .3);
    padding: 3px 9px; border-radius: 20px; font-size: 11px; font-style: normal;
  }
  #bubble .chip .dots i { display: inline-block; width: 3px; height: 3px; margin: 0 1px;
    background: #aebcff; border-radius: 50%; animation: dotpulse 1.2s infinite; vertical-align: middle; }
  #bubble .chip .dots i:nth-child(2) { animation-delay: .2s; }
  #bubble .chip .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dotpulse { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }

  /* ---------- toast ---------- */
  #toast { position: absolute; left: 6px; right: 6px; bottom: 152px;
    background: rgba(16, 18, 28, .93); backdrop-filter: blur(12px);
    color: #dfe4f5; border-radius: 12px;
    border: 1px solid rgba(140, 155, 255, .3);
    font-size: 11.5px; line-height: 1.45; padding: 8px 11px;
    opacity: 0; transform: translateY(6px);
    transition: opacity .3s, transform .3s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { border-color: rgba(255, 120, 130, .45); color: #ffd9dd;
    background: rgba(34, 16, 20, .93); }

  /* ---------- quick actions (hover) ---------- */
  #actions { position: absolute; bottom: 148px; right: 18px; display: flex; gap: 6px;
    opacity: 0; transform: translateY(5px); transition: opacity .22s, transform .22s;
    pointer-events: none; }
  #stage:hover ~ #actions, #actions:hover { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #actions button { width: 30px; height: 30px; border-radius: 10px; border: 1px solid rgba(150,160,255,.3);
    background: rgba(15, 17, 27, .9); backdrop-filter: blur(10px); color: #cdd5ff;
    font-size: 14px; cursor: pointer; display: grid; place-items: center;
    transition: background .15s, transform .12s; }
  #actions button:hover { background: rgba(60, 70, 160, .55); transform: translateY(-1px); }

  /* ---------- the creature ---------- */
  #stage { position: absolute; bottom: 8px; right: 10px; width: 136px; height: 136px;
    cursor: pointer; }
  #aura { position: absolute; inset: 4px; border-radius: 50%;
    background: radial-gradient(circle, var(--aura) 0%, transparent 68%);
    filter: blur(10px); animation: aurapulse 4.2s ease-in-out infinite;
    transition: opacity .5s; }
  @keyframes aurapulse { 0%,100% { transform: scale(1); opacity: .8; }
    50% { transform: scale(1.08); opacity: 1; } }

  #body { position: absolute; inset: 14px; transform-origin: 50% 90%;
    animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4px) scale(1.02, .995); } }
  #blob { position: absolute; inset: 0;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.5), transparent 42%),
      radial-gradient(circle at 35% 30%, var(--c1), var(--c2) 62%, var(--c3));
    border-radius: 47% 53% 51% 49% / 52% 48% 55% 45%;
    box-shadow: 0 8px 26px rgba(30, 36, 120, 0.5),
                inset 0 -10px 22px rgba(0,0,0,.22),
                inset 0 6px 14px rgba(255,255,255,.18);
    animation: morph 9s ease-in-out infinite;
    transition: filter .6s; }
  @keyframes morph {
    0%,100% { border-radius: 47% 53% 51% 49% / 52% 48% 55% 45%; }
    33%     { border-radius: 52% 48% 46% 54% / 48% 55% 45% 52%; }
    66%     { border-radius: 49% 51% 55% 45% / 55% 46% 52% 48%; } }

  .eye { position: absolute; top: 36px; width: 15px; height: 18px;
    border-radius: 50%; overflow: hidden; background: var(--ink);
    transition: height .18s, transform .25s; }
  #eyeL { left: 32px; } #eyeR { left: 62px; }
  .pupil { position: absolute; top: 3px; left: 4px; width: 5px; height: 5px;
    background: #d9e0ff; border-radius: 50%;
    transition: transform .5s cubic-bezier(.3,.9,.4,1); }
  .lid { position: absolute; top: -2px; left: -2px; right: -2px; height: 0;
    background: var(--c2); transition: height .09s ease-in; border-radius: 0 0 40% 40%; }
  .blink .lid { height: 110%; }

  #mouth { position: absolute; top: 64px; left: 47px; width: 16px; height: 7px;
    background: var(--ink); border-radius: 0 0 10px 10px;
    transition: all .25s; }
  .cheek { position: absolute; top: 58px; width: 10px; height: 6px; border-radius: 50%;
    background: rgba(255, 130, 160, .55); opacity: 0; transition: opacity .4s; filter: blur(1px); }
  #cheekL { left: 24px; } #cheekR { left: 76px; }

  /* capture indicator */
  #cap { position: absolute; top: 2px; right: 4px; width: 9px; height: 9px;
    border-radius: 50%; background: #4a4f66; border: 1.5px solid rgba(255,255,255,.45);
    transition: background .3s, box-shadow .3s; z-index: 3; }
  #cap.on { background: #ff5964; box-shadow: 0 0 8px #ff5964; }

  /* listening rings */
  .ring { position: absolute; inset: 6px; border: 2.5px solid rgba(126, 240, 201, .75);
    border-radius: 50%; opacity: 0; pointer-events: none; }
  .listening .ring { animation: pulse 1.3s ease-out infinite; }
  .listening .ring:nth-child(2) { animation-delay: .45s; }
  @keyframes pulse { from { transform: scale(.85); opacity: .85; }
    to { transform: scale(1.28); opacity: 0; } }

  /* thinking orbit */
  #orbit { position: absolute; inset: 2px; opacity: 0; transition: opacity .3s;
    animation: spin 2.6s linear infinite; pointer-events: none; }
  .thinking #orbit { opacity: 1; }
  #orbit i { position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: #ffd98f; box-shadow: 0 0 6px #ffca6a; }
  #orbit i:nth-child(1) { top: 0; left: 50%; }
  #orbit i:nth-child(2) { top: 50%; right: 0; transform: scale(.7); }
  #orbit i:nth-child(3) { bottom: 6%; left: 18%; transform: scale(.5); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* sleeping */
  #zzz { position: absolute; top: -6px; right: 12px; pointer-events: none; }
  #zzz span { position: absolute; right: 0; color: #aeb8e8; font-weight: 700;
    opacity: 0; font-size: 13px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .sleeping #zzz span { animation: floatz 3.6s ease-in infinite; }
  .sleeping #zzz span:nth-child(2) { font-size: 10px; animation-delay: 1.2s; right: 10px; }
  .sleeping #zzz span:nth-child(3) { font-size: 8px; animation-delay: 2.4s; right: 18px; }
  @keyframes floatz { 0% { opacity: 0; transform: translate(0, 0) rotate(0); }
    25% { opacity: .9; } 100% { opacity: 0; transform: translate(-14px, -34px) rotate(-18deg); } }

  /* ---------- moods ---------- */
  .sleeping { --aura: rgba(70, 80, 140, .3); }
  .sleeping #blob { filter: saturate(.4) brightness(.72); }
  .sleeping #body { animation-duration: 6.5s; }
  .sleeping .eye { height: 3px; border-radius: 3px; }
  .sleeping #mouth { width: 10px; height: 4px; border-radius: 4px; left: 50px; }

  .listening { --c1: #7ef0c9; --c2: #2ec48f; --c3: #1d8f66; --aura: rgba(46, 196, 143, .6); }
  .listening .eye { height: 20px; transform: translateY(-1px); }

  .thinking { --c1: #ffd98f; --c2: #e6a755; --c3: #b87d3a; --aura: rgba(230, 167, 85, .55); }
  .thinking #mouth { width: 9px; height: 9px; border-radius: 50%; left: 51px; }

  .speaking { --c1: #cba1ff; --c2: #8e5cf0; --c3: #6636c2; --aura: rgba(142, 92, 240, .6); }
  .speaking #mouth { animation: talk .26s ease-in-out infinite alternate; }
  .speaking #cheekL, .speaking #cheekR { opacity: 1; }
  .speaking #body { animation: bounce 0.52s ease-in-out infinite; }
  @keyframes talk { from { height: 5px; width: 14px; border-radius: 0 0 8px 8px; }
    to { height: 13px; width: 17px; border-radius: 45%; } }
  @keyframes bounce { 0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2.5px) scale(1.008); } }

  .celebrate { --c1: #ffe08a; --c2: #ffb347; --c3: #e08a2e; --aura: rgba(255, 190, 80, .7); }
  .celebrate #body { animation: hop .55s cubic-bezier(.3,1.6,.5,1) 2; }
  .celebrate #cheekL, .celebrate #cheekR { opacity: 1; }
  .celebrate #mouth { height: 11px; width: 18px; border-radius: 0 0 12px 12px; left: 46px; }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-14px) scale(1.03, .97); }
    70% { transform: translateY(0) scale(.97, 1.02); } }

  .confetti { position: absolute; width: 6px; height: 9px; top: 46%; left: 48%;
    border-radius: 2px; pointer-events: none;
    animation: burst .95s cubic-bezier(.15,.75,.45,1) forwards; }
  @keyframes burst {
    from { transform: translate(0,0) rotate(0); opacity: 1; }
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }

  /* click squash */
  #stage.press #body { animation: none; transform: scale(.9, .94) translateY(2px); }
</style>
</head>
<body>
  <div id="bubble"></div>
  <div id="toast"></div>
  <div id="stage" title="Rev — click for panel, drag to move">
    <div id="aura"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div id="orbit"><i></i><i></i><i></i></div>
    <div id="body">
      <div id="blob"></div>
      <div id="eyeL" class="eye"><div class="pupil"></div><div class="lid"></div></div>
      <div id="eyeR" class="eye"><div class="pupil"></div><div class="lid"></div></div>
      <div id="cheekL" class="cheek"></div>
      <div id="cheekR" class="cheek"></div>
      <div id="mouth"></div>
    </div>
    <div id="zzz"><span>Z</span><span>Z</span><span>Z</span></div>
    <div id="cap" title="capture indicator"></div>
  </div>
  <div id="actions">
    <button id="act-mute" title="Mute Rev">🔊</button>
    <button id="act-panel" title="Open panel">💬</button>
  </div>
<script>
  const T = window.__TAURI__;
  const invoke = T.core.invoke;
  const listen = T.event.listen;

  const body = document.body;
  const stage = document.getElementById("stage");
  const bubble = document.getElementById("bubble");
  const toast = document.getElementById("toast");
  const cap = document.getElementById("cap");
  let hideTimer = null, toastTimer = null, celebrateTimer = null;
  let state = "watching";
  let muted = false;
  let bubbleStale = false; // last answer finished; next delta starts fresh

  function setState(s) {
    if (s === "celebrate") {
      body.className = "celebrate";
      confettiBurst();
      clearTimeout(celebrateTimer);
      celebrateTimer = setTimeout(() => { body.className = state = "speaking"; }, 1300);
      return;
    }
    state = s;
    body.className = s;
  }
  setState("watching");
  listen("rev:pet", (e) => setState(e.payload));

  // ---------- natural blinking ----------
  const eyes = [document.getElementById("eyeL"), document.getElementById("eyeR")];
  function blink(times) {
    eyes.forEach(e => e.classList.add("blink"));
    setTimeout(() => {
      eyes.forEach(e => e.classList.remove("blink"));
      if (times > 1) setTimeout(() => blink(times - 1), 110);
    }, 95);
  }
  (function blinkLoop() {
    setTimeout(() => {
      if (state !== "sleeping") blink(Math.random() < 0.16 ? 2 : 1);
      blinkLoop();
    }, 2200 + Math.random() * 4200);
  })();

  // ---------- wandering gaze ----------
  const pupils = document.querySelectorAll(".pupil");
  function gaze(x, y) { pupils.forEach(p => p.style.transform = `translate(${x}px, ${y}px)`); }
  (function gazeLoop() {
    setTimeout(() => {
      if (state === "watching") {
        gaze((Math.random() * 6 - 3) | 0, (Math.random() * 4 - 1.5) | 0);
      } else if (state === "thinking") {
        gaze(Math.random() < 0.5 ? -3 : 3, -3);
      } else if (state === "listening" || state === "speaking") {
        gaze(0, 0);
      }
      gazeLoop();
    }, 1600 + Math.random() * 2600);
  })();

  // ---------- celebrate confetti ----------
  const CONF_COLORS = ["#ffd98f", "#8f9dff", "#7ef0c9", "#ff9fb3", "#cba1ff"];
  function confettiBurst() {
    for (let i = 0; i < 16; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      const ang = Math.random() * Math.PI * 2;
      const dist = 42 + Math.random() * 38;
      c.style.setProperty("--dx", `${Math.cos(ang) * dist}px`);
      c.style.setProperty("--dy", `${Math.sin(ang) * dist - 26}px`);
      c.style.setProperty("--rot", `${(Math.random() * 540 - 270) | 0}deg`);
      c.style.background = CONF_COLORS[i % CONF_COLORS.length];
      stage.appendChild(c);
      setTimeout(() => c.remove(), 1000);
    }
  }

  // ---------- speech bubble ----------
  function chipFor(what) {
    if (/^remember/.test(what)) return "💾 saving a memory";
    if (/^profile/.test(what)) return "📝 updating your profile";
    return "🔍 checking the web";
  }
  listen("rev:delta", (e) => {
    clearTimeout(hideTimer);
    if (bubbleStale) { bubble.textContent = ""; bubbleStale = false; }
    bubble.classList.add("show");
    bubble.querySelector(".chip")?.remove();
    bubble.querySelector(".caret")?.remove();
    bubble.append(document.createTextNode(e.payload));
    const caret = document.createElement("span");
    caret.className = "caret";
    bubble.append(caret);
    bubble.scrollTop = bubble.scrollHeight;
  });
  listen("rev:tool", (e) => {
    if (bubbleStale) { bubble.textContent = ""; bubbleStale = false; }
    bubble.classList.add("show");
    bubble.querySelector(".chip")?.remove();
    const d = document.createElement("div");
    d.className = "chip";
    d.innerHTML = `${chipFor(String(e.payload || ""))} <span class="dots"><i></i><i></i><i></i></span>`;
    bubble.append(d);
    bubble.scrollTop = bubble.scrollHeight;
  });
  listen("rev:speech-done", () => {
    bubble.querySelector(".caret")?.remove();
    bubble.querySelector(".chip")?.remove();
    bubbleStale = true;
    hideTimer = setTimeout(() => {
      bubble.classList.remove("show");
      setTimeout(() => (bubble.textContent = ""), 300);
    }, 8000);
  });

  // ---------- status / toast ----------
  listen("rev:status", (e) => {
    const s = e.payload;
    cap.className = s.capture_enabled && !s.capture_error ? "on" : "";
    muted = !!s.muted;
    document.getElementById("act-mute").textContent = muted ? "🔇" : "🔊";
  });
  listen("rev:toast", (e) => {
    const text = String(e.payload);
    toast.textContent = text;
    toast.className = /fail|wasn|missing|cap |rejected|rate-limit|could not|unavailable/i.test(text)
      ? "show error" : "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 6000);
  });

  // ---------- quick actions ----------
  document.getElementById("act-mute").addEventListener("mousedown", (e) => e.stopPropagation());
  document.getElementById("act-panel").addEventListener("mousedown", (e) => e.stopPropagation());
  document.getElementById("act-mute").addEventListener("click", (e) => {
    e.stopPropagation();
    invoke("set_muted", { muted: !muted });
  });
  document.getElementById("act-panel").addEventListener("click", (e) => {
    e.stopPropagation();
    invoke("toggle_panel");
  });

  // ---------- click = panel, drag = move ----------
  stage.addEventListener("mousedown", async (e) => {
    if (e.button !== 0) return;
    stage.classList.add("press");
    const x0 = e.screenX, y0 = e.screenY;
    let dragged = false;
    const move = (m) => {
      if (!dragged && Math.hypot(m.screenX - x0, m.screenY - y0) > 5) {
        dragged = true;
        const win = (T.window.getCurrentWindow || T.window.getCurrent).call(T.window);
        win.startDragging();
      }
    };
    const up = () => {
      stage.classList.remove("press");
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      if (!dragged) invoke("toggle_panel");
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
</script>
</body>
</html>
