<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rev</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%;
    font-family: "Segoe UI", system-ui, sans-serif; }

  #bubble {
    position: absolute; top: 6px; left: 6px; right: 6px; max-height: 170px;
    overflow-y: auto; scrollbar-width: none;
    background: rgba(18, 20, 30, 0.92); color: #e8eaf2;
    border: 1px solid rgba(120, 140, 255, 0.35); border-radius: 12px;
    padding: 9px 11px; font-size: 12.5px; line-height: 1.45;
    opacity: 0; transition: opacity .25s; pointer-events: none;
    word-wrap: break-word;
  }
  #bubble.show { opacity: 1; }
  #bubble .tool { color: #9fb4ff; font-style: italic; }

  #pet {
    position: absolute; bottom: 10px; right: 14px; width: 110px; height: 110px;
    cursor: pointer;
  }
  #blob {
    position: absolute; inset: 8px;
    background: radial-gradient(circle at 35% 30%, #8f9dff, #5560e6 65%, #3a44b8);
    border-radius: 46% 54% 52% 48% / 50% 46% 54% 50%;
    box-shadow: 0 6px 22px rgba(60, 70, 200, 0.45);
    animation: idle 4.2s ease-in-out infinite;
  }
  @keyframes idle { 0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4px) scale(1.015); } }

  .eye {
    position: absolute; top: 38px; width: 13px; height: 15px;
    background: #101322; border-radius: 50%;
    transition: height .15s;
  }
  #eyeL { left: 32px; } #eyeR { left: 60px; }
  .eye::after { content: ""; position: absolute; top: 2px; left: 3px;
    width: 4px; height: 4px; background: #cfd6ff; border-radius: 50%; }

  #mouth { position: absolute; top: 62px; left: 44px; width: 18px; height: 5px;
    background: #101322; border-radius: 3px; transition: all .15s; }

  /* capture indicator eye-dot */
  #cap { position: absolute; top: 6px; right: 8px; width: 9px; height: 9px;
    border-radius: 50%; background: #555a70; border: 1.5px solid rgba(255,255,255,.5); }
  #cap.on { background: #ff5964; box-shadow: 0 0 7px #ff5964; }

  /* states */
  .sleeping #blob { filter: saturate(.35) brightness(.75); animation-duration: 6s; }
  .sleeping .eye { height: 2px; border-radius: 2px; }
  .listening #blob { background: radial-gradient(circle at 35% 30%, #7ef0c9, #2ec48f 65%, #1d8f66);
    box-shadow: 0 0 26px rgba(46, 196, 143, .65); }
  .listening #ring { position: absolute; inset: 0; border: 2.5px solid rgba(126, 240, 201, .8);
    border-radius: 50%; animation: pulse 1.1s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.82); opacity: .9; } to { transform: scale(1.22); opacity: 0; } }
  .thinking #blob { background: radial-gradient(circle at 35% 30%, #ffd98f, #e6a755 65%, #b87d3a); }
  .thinking .eye { animation: look 1s ease-in-out infinite alternate; }
  @keyframes look { from { transform: translateX(-2px); } to { transform: translateX(2px); } }
  .speaking #mouth { animation: talk .28s ease-in-out infinite alternate; }
  @keyframes talk { from { height: 4px; } to { height: 12px; border-radius: 7px; } }

  #toast { position: absolute; left: 6px; right: 6px; bottom: 126px;
    background: rgba(40, 22, 22, .95); color: #ffd7d7; border-radius: 10px;
    border: 1px solid rgba(255, 120, 120, .4);
    font-size: 11.5px; padding: 7px 9px; opacity: 0; transition: opacity .3s;
    pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <div id="bubble"></div>
  <div id="toast"></div>
  <div id="pet" title="Rev — click for panel, drag to move">
    <div id="ring"></div>
    <div id="blob"></div>
    <div id="eyeL" class="eye"></div>
    <div id="eyeR" class="eye"></div>
    <div id="mouth"></div>
    <div id="cap" title="capture indicator"></div>
  </div>
<script>
  const T = window.__TAURI__;
  const invoke = T.core.invoke;
  const listen = T.event.listen;

  const body = document.body;
  const bubble = document.getElementById("bubble");
  const toast = document.getElementById("toast");
  const cap = document.getElementById("cap");
  let hideTimer = null, toastTimer = null;

  function setState(s) {
    body.className = s;
  }
  setState("watching");

  listen("rev:pet", (e) => setState(e.payload));

  listen("rev:delta", (e) => {
    clearTimeout(hideTimer);
    bubble.classList.add("show");
    const t = bubble.querySelector(".tool");
    if (t) t.remove();
    bubble.append(document.createTextNode(e.payload));
    bubble.scrollTop = bubble.scrollHeight;
  });

  listen("rev:tool", () => {
    bubble.classList.add("show");
    if (!bubble.querySelector(".tool")) {
      const d = document.createElement("div");
      d.className = "tool";
      d.textContent = "🔍 looking it up…";
      bubble.append(d);
    }
  });

  listen("rev:speech-done", () => {
    hideTimer = setTimeout(() => {
      bubble.classList.remove("show");
      setTimeout(() => (bubble.textContent = ""), 300);
    }, 8000);
  });

  listen("rev:status", (e) => {
    cap.className = e.payload.capture_enabled && !e.payload.capture_error ? "on" : "";
  });

  listen("rev:toast", (e) => {
    toast.textContent = e.payload;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 6000);
  });

  // Click toggles the panel; a real drag moves the window.
  const pet = document.getElementById("pet");
  pet.addEventListener("mousedown", async (e) => {
    if (e.button !== 0) return;
    const x0 = e.screenX, y0 = e.screenY;
    let dragged = false;
    const move = (m) => {
      if (!dragged && Math.hypot(m.screenX - x0, m.screenY - y0) > 5) {
        dragged = true;
        const win = (T.window.getCurrentWindow || T.window.getCurrent).call(T.window);
        win.startDragging();
      }
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      if (!dragged) invoke("toggle_panel");
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
</script>
</body>
</html>
