[package]
name = "revolution-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform-independent engine for the Revolution AI gaming companion: provider adapters, vision change-gating, keyframe ring, memory store, prompt builder, PTT orchestrator."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
toml = "0.8"
